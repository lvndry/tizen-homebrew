# Publish the catalog to GitHub Pages.
#
# The service on the TV fetches the app list from here:
#     https://lvndry.github.io/tizen-homebrew/catalog/catalog.json
# A commit to catalog/ is the whole release process — no rebuild, no
# reinstall, and the set picks it up the next time someone opens the app
# list.
name: catalog

on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: catalog

      - id: deployment
        uses: actions/deploy-pages@v4
